apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-lab-prod

resources:
  - ../../base

labels:
  - pairs:
      environment: prod

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - APP_ENV=prod

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: backend
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

# Only changed through the "promote-to-prod" workflow, which opens a PR.
images:
  - name: backend
    newName: us-central1-docker.pkg.dev/testgcpproject-508711/gitops-lab/backend
    newTag: latest
  - name: frontend
    newName: us-central1-docker.pkg.dev/testgcpproject-508711/gitops-lab/frontend
    newTag: latest
