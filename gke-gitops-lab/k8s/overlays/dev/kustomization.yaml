apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-lab-dev

resources:
  - ../../base

labels:
  - pairs:
      environment: dev

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - APP_ENV=dev

# CI updates newTag on every merge to main (see .github/workflows/_build-push.yml).
images:
  - name: backend
    newName: us-central1-docker.pkg.dev/testgcpproject-508711/gitops-lab/backend
    newTag: latest
  - name: frontend
    newName: us-central1-docker.pkg.dev/testgcpproject-508711/gitops-lab/frontend
    newTag: latest
